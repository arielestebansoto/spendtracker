services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"

  nginx:
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/common:/etc/nginx/common:ro
      - ./infra/nginx/dev/server.conf:/etc/nginx/server.conf:ro
      - ./infra/nginx/dev/certs:/etc/nginx/certs:ro
