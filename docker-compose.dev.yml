services:
  postgres:
    image: postgres:17
    mem_limit: 256m

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - app

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:3000"

volumes:
  postgres-data:

networks:
  app:
