management:
  endpoints:
    web:
      exposure:
        include: health
  
  endpoint:
    health:
      show-details: never

server:
  tomcat:
    threads:
      max: 50
      min-spare: 5
      
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  
  jpa:
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${OAUTH2_GITHUB_CLIENT_ID}
            client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET}
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
app:
  oauth2:
    default-success-url: ${OAUTH2_SUCCESS_URL}
  logout:
    logout-url: /api/v1/auth/logout
  cors:
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Cache-Control,Content-Type,X-XSRF-TOKEN
  storage:
    s3:
      bucket-name: ${S3_BUCKET_NAME:}
      region: ${AWS_REGION:}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  bedrock:
    model-id: ${BEDROCK_MODEL_ID:amazon.titan-text-lite-v1}
  ai-usage:
    global:
      analyze-expense-pages: 100
      detect-text-pages: 1000
      bedrock-input-tokens: 1000000
      bedrock-output-tokens: 1000000
    user:
      analyze-expense-pages: 10
      detect-text-pages: 100
      bedrock-input-tokens: 100000
      bedrock-output-tokens: 100000
