management:
  endpoints:
    web:
      exposure:
        include: health
  
  endpoint:
    health:
      show-details: never

server:
  tomcat:
    threads:
      max: 50
      min-spare: 5
      
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  
  jpa:
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${OAUTH2_GITHUB_CLIENT_ID}
            client-secret: ${OAUTH2_GITHUB_CLIENT_SECRET}
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
app:
  oauth2:
    default-success-url: ${OAUTH2_SUCCESS_URL}
    # Frontend page with the login buttons, where a failed login is sent with ?error=<OAuth2 error code>
    # (e.g. access_denied, not_invited), or login_failed when the failure has no OAuth2 code.
    failure-url: ${OAUTH2_FAILURE_URL:${OAUTH2_SUCCESS_URL}}
  access:
    # Only emails in the allowed_emails table can log in (see docs/access-allowlist.md). On unless turned off.
    allowlist-enabled: ${ACCESS_ALLOWLIST_ENABLED:true}
  logout:
    logout-url: /api/v1/auth/logout
  cors:
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Cache-Control,Content-Type,X-XSRF-TOKEN
  aws:
    # Each worker stage must finish within CLAIM_LEASE (60 s) in ReceiptProcessingService, and so within the
    # work queues' visibility timeout (120 s, see docs/sqs-provisioning.md). These caps on a whole AWS call,
    # retries included, keep it there: Extraction is S3 + 2 x Textract = 50 s, Enrichment is Bedrock = 45 s.
    textract:
      enabled: true
      api-call-timeout: ${TEXTRACT_API_CALL_TIMEOUT:PT20S}
    bedrock:
      enabled: true
  billing:
    enabled: false
  storage:
    s3:
      bucket-name: ${S3_BUCKET_NAME:}
      region: ${AWS_REGION:}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      api-call-timeout: ${S3_API_CALL_TIMEOUT:PT10S}
  sqs:
    region: ${AWS_REGION:}
    receipt-extraction-queue-url: ${SQS_RECEIPT_EXTRACTION_QUEUE_URL:}
    spend-enrichment-queue-url: ${SQS_SPEND_ENRICHMENT_QUEUE_URL:}
    max-receive-count: 3
    polling-enabled: true
  stuck-spend-cleanup:
    # Spends PENDING or PROCESSING for longer than this are marked FAILED.
    threshold: ${STUCK_SPEND_THRESHOLD:PT15M}
    # Delay between cleanup runs, measured from the end of the previous run.
    interval: ${STUCK_SPEND_CLEANUP_INTERVAL:PT5M}
  bedrock:
    model-id: ${BEDROCK_MODEL_ID:amazon.titan-text-lite-v1}
    api-call-timeout: ${BEDROCK_API_CALL_TIMEOUT:PT45S}
  ai-usage:
    global:
      analyze-expense-pages: 100
      detect-text-pages: 1000
      bedrock-input-tokens: 1000000
      bedrock-output-tokens: 1000000
    user:
      analyze-expense-pages: 10
      detect-text-pages: 100
      bedrock-input-tokens: 100000
      bedrock-output-tokens: 100000
