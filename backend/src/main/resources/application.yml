spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

app:
  csrf:
    ignore-urls: /api/v1/auth/login
  oauth2:
    default-success-url: http://localhost:3000/dashboard
  logout:
    logout-url: /api/v1/auth/logout
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  storage:
    local:
      path: uploads