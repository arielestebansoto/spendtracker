management:
  endpoints:
    web:
      exposure:
        include: health,metrics

server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  jpa:
    show-sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: TRACE