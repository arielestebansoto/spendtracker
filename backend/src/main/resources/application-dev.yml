management:
  endpoints:
    web:
      exposure:
        include: health,metrics

server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  jpa:
    show-sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  access:
    # A fresh local database has no allowed emails; set ACCESS_ALLOWLIST_ENABLED=true to try the allowlist.
    allowlist-enabled: ${ACCESS_ALLOWLIST_ENABLED:false}
    
springdoc:
  api-docs:
    enabled: true
  paths-to-match: /api/v1/**
  swagger-ui:
    enabled: true
    # Swagger UI copies the XSRF-TOKEN cookie into the X-XSRF-TOKEN header of every
    # state-changing request, like the frontend does.
    csrf:
      enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG
    org.springframework.security: DEBUG
    com.arielsoto.spendtracker.classifier: DEBUG
    com.arielsoto.spendtracker.receipt: DEBUG