name: Backend tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest has Docker, so the Testcontainers tests run instead of being skipped.
      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon
