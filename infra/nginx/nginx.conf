events {
}

http {
    # Hide send server info
    server_tokens off;

    log_format main escape=json
        '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"request":"$request",'
        '"status":"$status",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    client_max_body_size 10M;
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml
        image/svg+xml;

    limit_req_zone $binary_remote_addr zone=frontend:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Impide que tu aplicación se cargue dentro de un iframe
    add_header X-Frame-Options "DENY" always;

    # Evita que el navegador "adivine" tipos de archivo
    add_header X-Content-Type-Options "nosniff" always;

    # Controla qué información se envía en el header:
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    include /etc/nginx/project/dev/server.conf;
}